[server]
port = 8080
address = '0.0.0.0'
enableCORS = false
enableXsrfProtection = false
runOnSave = true
 
[theme]
# --- Hat Shop Aesthetic ---
# Warm, boutique feel: aged parchment backgrounds, rich leather browns,
# cream whites, and a deep forest accent for CTAs.
 
primaryColor        = "#7B4F2E"   # saddle leather — buttons, links, active states
backgroundColor     = "#FAF6F0"   # aged parchment — main page background
secondaryBackgroundColor = "#EFE8DC"  # warm linen — sidebar, cards, input areas
textColor           = "#2C1A0E"   # dark espresso — primary text
 
# Font: serif gives an artisan / boutique feel.
# Streamlit supports "sans serif", "serif", and "monospace".
font = "serif"
 
[browser]
gatherUsageStats = false
 
